# ─────────────────────────────────────────────────────────────────────────────
# Home Assistant – Package „ElternInfoBoard" (App-API v1)
#
# Einrichtung (siehe docs/home-assistant/README.md):
#   1. ElternInfoBoard → Einstellungen → „Neues Integrations-Token erstellen"
#      (Name „Home Assistant", Laufzeit nach Wunsch, keine Zusatzrechte nötig)
#   2. secrets.yaml:        elterninfo_bearer: "Bearer <Token>"
#   3. configuration.yaml:  homeassistant:
#                             packages: !include_dir_named packages
#   4. Diese Datei nach /config/packages/elterninfo.yaml kopieren, Konfiguration prüfen, neu starten.
#
# Die Sensoren werden auf der Dashboard-Seite „ElternInfo" (Dashboard „Familie") angezeigt.
# ─────────────────────────────────────────────────────────────────────────────

rest:
  # Startseite: Kinder heute (CheckIn, Schickzeit, Krankmeldung), Aufgaben, Termine, Beiträge, Losung
  - resource: https://eltern.esz-radebeul.de/api/v1/parent/dashboard
    headers:
      Authorization: !secret elterninfo_bearer
      Accept: application/json
    scan_interval: 300
    timeout: 30
    sensor:
      - name: "ElternInfo Übersicht"
        unique_id: elterninfo_uebersicht
        icon: mdi:school-outline
        unit_of_measurement: "Aufgaben"
        value_template: "{{ value_json.data.todo | count }}"
        json_attributes_path: "$.data"
        json_attributes:
          - care_active
          - children
          - todo
          - termine
          - posts
          - losung
          - active_diseases

  # Ungelesene Benachrichtigungen
  - resource: https://eltern.esz-radebeul.de/api/v1/notifications?unread=1
    headers:
      Authorization: !secret elterninfo_bearer
      Accept: application/json
    scan_interval: 300
    timeout: 30
    sensor:
      - name: "ElternInfo Benachrichtigungen"
        unique_id: elterninfo_benachrichtigungen
        icon: mdi:bell-outline
        unit_of_measurement: "ungelesen"
        value_template: "{{ value_json.meta.unread }}"
        json_attributes:
          - data

  # Vertretungsplan (nur mit Recht „view vertretungsplan"; sonst bleibt der Sensor „unavailable")
  - resource: https://eltern.esz-radebeul.de/api/v1/vertretungsplan
    headers:
      Authorization: !secret elterninfo_bearer
      Accept: application/json
    scan_interval: 900
    timeout: 30
    sensor:
      - name: "ElternInfo Vertretungsplan"
        unique_id: elterninfo_vertretungsplan
        icon: mdi:swap-horizontal
        unit_of_measurement: "Vertretungen"
        value_template: "{{ value_json.data.vertretungen | count }}"
        json_attributes_path: "$.data"
        json_attributes:
          - vertretungen
          - news
          - week
          - absences

template:
  - sensor:
      # Status je Kind für Automationen/Kacheln. Für weitere Kinder Block kopieren und Vornamen anpassen.
      - name: "Nele ElternInfo Status"
        unique_id: elterninfo_status_nele
        icon: >
          {% set s = this.state %}
          {{ {'krank': 'mdi:emoticon-sick-outline', 'in der Einrichtung': 'mdi:school', 'abgeholt': 'mdi:home-account',
              'angemeldet': 'mdi:calendar-check', 'abgemeldet': 'mdi:calendar-remove'}.get(s, 'mdi:account-child') }}
        state: >
          {% set c = state_attr('sensor.elterninfo_ubersicht', 'children') | default([], true)
                     | selectattr('first_name', 'eq', 'Nele') | list | first | default(none) %}
          {% set t = c.today if c else none %}
          {% if not t %}unbekannt
          {% elif t.krank_bis %}krank
          {% elif t.check_in is none %}kein Eintrag
          {% elif t.check_in.checked_out %}abgeholt
          {% elif t.check_in.checked_in %}in der Einrichtung
          {% elif t.check_in.should_be %}angemeldet
          {% elif t.check_in.should_be == false %}abgemeldet
          {% else %}offen{% endif %}
        attributes:
          schickzeit: >
            {% set c = state_attr('sensor.elterninfo_ubersicht', 'children') | default([], true)
                       | selectattr('first_name', 'eq', 'Nele') | list | first | default(none) %}
            {% set s = c.today.schickzeit if c else none %}
            {% if not s %}–{% elif s.type == 'ab' %}ab {{ s.time_ab }}{{ ' bis ' ~ s.time_spaet if s.time_spaet }} Uhr{% else %}{{ s.time }} Uhr{% endif %}
          krank_bis: >
            {% set c = state_attr('sensor.elterninfo_ubersicht', 'children') | default([], true)
                       | selectattr('first_name', 'eq', 'Nele') | list | first | default(none) %}
            {{ c.today.krank_bis if c else none }}
